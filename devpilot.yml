# DevPilot configuration for the DevPilot repository itself
exclude:
  - examples
  - dashboard

analyzers:
  code_health:
    enabled: true
    max_complexity: 15
    max_function_lines: 180
    max_parameters: 8
  dependencies:
    enabled: true
    engine: osv
    check_outdated: false
  setup_doctor:
    enabled: true
  documentation:
    enabled: true

ai:
  enabled: true
  provider: groq

verify:
  timeout: 180
  run_tests: true
