name: DevPilot CI & PR Intelligence

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Minimal read-only permissions; fork PRs run safely without secrets.
permissions:
  contents: read

jobs:
  devpilot:
    name: DevPilot Scan, Tests & PR Impact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DevPilot & test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run DevPilot automated test suite
        run: pytest -q

      - name: Run DevPilot CI scan and PR diff impact analysis
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          devpilot ci . --base "$BASE_REF" --fail-on critical

      - name: Upload DevPilot JSON report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devpilot-report
          path: .devpilot/reports/latest.json
          if-no-files-found: ignore
