[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot"
version = "0.1.0"
description = "DevPilot - your repository's AI engineering assistant. Detect, understand, analyze impact, fix, verify and remember."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DevPilot contributors" }]
keywords = ["static-analysis", "developer-tools", "ai", "code-quality", "security", "git"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.5",
    "ruff>=0.5",
    "pyyaml>=6",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
audit = ["pip-audit>=2.7"]
dev = ["pytest>=8", "pip-audit>=2.7"]

[project.scripts]
devpilot = "devpilot.cli.main:app"

[tool.setuptools.packages.find]
include = ["devpilot*"]

[tool.setuptools.package-data]
devpilot = ["dashboard_server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["examples", "dashboard"]

[tool.ruff.lint]
select = ["F", "E9", "E722", "B", "C901", "S102", "S307", "S602", "S506"]
flake8-bugbear.extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]
mccabe.max-complexity = 15
